services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DANCEFLOW_DEMO_DATABASE:-vibe_music}
      MYSQL_USER: danceflow
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql-app-password
    secrets:
      - mysql-root-password
      - mysql-app-password
      - mysql-client-config
    ports:
      - "127.0.0.1:${DANCEFLOW_DEMO_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
  redis:
    image: redis:7-alpine
    # Bind-mounted secret files remain 0600; use the local file owner's identity.
    user: "${DANCEFLOW_DEMO_UID:-1000}:${DANCEFLOW_DEMO_GID:-1000}"
    command: ["redis-server", "/run/secrets/redis-config"]
    secrets:
      - redis-config
      - redis-password
    ports:
      - "127.0.0.1:${DANCEFLOW_DEMO_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis-password) redis-cli ping"]
      interval: 2s
      timeout: 5s
      retries: 30
secrets:
  mysql-root-password:
    file: ${DANCEFLOW_DEMO_STATE_DIR}/mysql-root-password
  mysql-app-password:
    file: ${DANCEFLOW_DEMO_STATE_DIR}/mysql-app-password
  mysql-client-config:
    file: ${DANCEFLOW_DEMO_STATE_DIR}/mysql-client.cnf
  redis-password:
    file: ${DANCEFLOW_DEMO_STATE_DIR}/redis-password
  redis-config:
    file: ${DANCEFLOW_DEMO_STATE_DIR}/redis.conf
volumes:
  mysql-data:
